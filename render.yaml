# Render Blueprint (https://render.com) — 晶流 LabFlow 一键部署
# 复赛 Demo 部署：零第三方运行时依赖，Node >= 20，读取 PORT 环境变量。
# 部署方式：Render 控制台 → New → Blueprint → 选择本仓库 → 自动读取 render.yaml。
services:
  - type: web
    name: labflow-demo
    runtime: docker
    repo: https://github.com/haoyiwang555-alt/-LabFlow---AI-
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      # 可选：接入真实 LLM（OpenAI-compatible）后取消注释并填写密钥
      # - key: LLM_API_KEY
      #   sync: false
      # - key: LLM_BASE_URL
      #   value: https://api.openai.com/v1
      # - key: LLM_MODEL
      #   value: gpt-3.5-turbo
      # 可选：Redis / Neo4j（当前 JSON 适配器为默认数据源，未配置时诚实降级）
      # - key: REDIS_URL
      #   sync: false
      # - key: NEO4J_URI
      #   sync: false
